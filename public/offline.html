<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Darion Academy</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1117;
            color: #f4f7fa;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 40px;
            background-color: #121b24;
            border-radius: 12px;
            border: 1px solid #293744;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
        }
        svg {
            width: 48px;
            height: 48px;
            color: #9aa8b4;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 8px 0;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: #9aa8b4;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }
        button {
            background-color: #20a5cf;
            color: #071117;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #42b7da;
        }
        button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 2l20 20"></path>
            <path d="M8.5 8.5C10.5 6.5 13.5 6.5 15.5 8.5"></path>
            <path d="M5 5C9 1 15 1 19 5"></path>
            <path d="M12 16h.01"></path>
        </svg>
        <h1>You are currently offline</h1>
        <p>Darion Academy requires an active internet connection. Please check your network settings and try again.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
