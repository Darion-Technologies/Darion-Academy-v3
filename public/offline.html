<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Darion Academy</title>
    <style>
        :root {
            --background: #FAFAFA;
            --foreground: #111111;
            --card: #FFFFFF;
            --border: #EAEAEA;
            --primary: #0070F3;
            --primary-foreground: #FFFFFF;
            --muted-foreground: #878787;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #111111;
                --foreground: #EDEDED;
                --card: #161616;
                --border: #2E2E2E;
            }
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--foreground);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 420px;
            padding: 48px 40px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 0px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.5);
        }
        svg {
            width: 48px;
            height: 48px;
            color: var(--primary);
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 12px 0;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        p {
            font-size: 15px;
            color: var(--muted-foreground);
            margin: 0 0 32px 0;
            line-height: 1.6;
        }
        button {
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 12px 24px;
            border-radius: 0px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #3291FF;
        }
        button:active {
            transform: scale(0.98);
        }
        .brand {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 32px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="brand">Darion Academy</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 2l20 20"></path>
            <path d="M8.5 8.5C10.5 6.5 13.5 6.5 15.5 8.5"></path>
            <path d="M5 5C9 1 15 1 19 5"></path>
            <path d="M12 16h.01"></path>
        </svg>
        <h1>Connection Lost</h1>
        <p>You are currently offline. Darion Academy requires an active internet connection to sync your progress.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
